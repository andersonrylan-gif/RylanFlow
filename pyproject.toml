[project]
name = "rylanflow"
version = "0.1.0"
description = "Hold a key, talk, release: on-device dictation for macOS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
rylanflow = "rylanflow.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
